name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TETRABENCH_REQUIRE_NATIVE_CONSUMERS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Validate workflow syntax and shell commands
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/ci.yml .github/workflows/release.yml
        # rhysd/actionlint:1.7.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Set up native-consumer Node LTS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Install locked official native consumers
        run: |
          uv run --locked python tools/install_native_consumers.py \
            --prefix "$RUNNER_TEMP/tetrabench-native"
          printf 'TETRABENCH_NATIVE_NODE_MODULES=%s/node_modules\n' \
            "$RUNNER_TEMP/tetrabench-native" >> "$GITHUB_ENV"

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run ty check

      - name: Scan production source
        run: uv run bandit --quiet --recursive src tools

      - name: Check Docker daemon
        run: docker info

      - name: Run required Docker tests
        run: TETRABENCH_EXPECT_DOCKER_TESTS=12 uv run pytest --strict-markers -m docker

      - name: Run required native consumer tests without authentication
        shell: bash
        run: |
          # Ubuntu 24.04 restricts nested unprivileged namespaces via AppArmor.
          # Restore the ephemeral runner policy even when a consumer fails.
          # https://github.com/actions/runner-images/issues/10443
          namespace_policy=kernel.apparmor_restrict_unprivileged_userns
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            namespace_policy_before="$(sysctl -n "$namespace_policy")"
            trap 'sudo sysctl -w "$namespace_policy=$namespace_policy_before"' EXIT
            sudo sysctl -w "$namespace_policy=0"
          fi
          unshare --user --map-root-user --net --pid --fork --kill-child true

          # Offline native parsing gets its own network namespace, not credentials.
          sudo unshare --net -- setpriv \
            --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env PATH="$PATH" HOME="$RUNNER_TEMP/tetrabench-native/home" \
            TETRABENCH_REQUIRE_NATIVE_CONSUMERS=1 \
            TETRABENCH_NATIVE_NODE_MODULES="$TETRABENCH_NATIVE_NODE_MODULES" \
            "$(command -v uv)" run --no-sync --offline pytest --strict-markers -m native

      - name: Run remaining non-Docker test suite
        run: uv run pytest --strict-markers -m "not docker and not native"

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata and README rendering
        run: uv run --locked twine check --strict dist/*.whl dist/*.tar.gz

      - name: Smoke-test isolated wheel, Docker, and offline Modal graph
        run: >-
          uv run python tools/distribution_smoke.py
          --wheel dist/tetrabench-*.whl
          --sdist dist/tetrabench-*.tar.gz
          --work-dir "${{ runner.temp }}/tetrabench-wheel-smoke"
          --category release-smoke --docker

      - name: Audit all locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          requirements="$(mktemp)"
          trap 'rm -f "$requirements"' EXIT
          uv export --quiet --locked --all-groups --no-emit-project > "$requirements"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$requirements"

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --redact --verbose --no-banner
        # ghcr.io/gitleaks/gitleaks:v8.30.1
