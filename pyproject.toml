[project]
name = "tetrabench"
version = "0.1.0"
description = "Harbor evaluation orchestration with durable artifact publication"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.83",
    "botocore[crt]==1.43.83",
    "harbor[modal]==0.22.0",
    "modal==1.5.4",
    "platformdirs>=4.11.5",
    "pydantic==2.13.5",
    "rfc8785==0.1.4",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
tetrabench = "tetrabench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetrabench"]

[tool.hatch.build]
exclude = [
    "/benchmarks/tasks/systems-design/authority-fencing",
    "/questionnaire-meme.png",
    "/tests/test_authority_fencing_task.py",
    "/tools/run_authority_fencing_admission.py",
    "/tests/test_authority_fencing_calibration.py",
    "/tools/run_authority_fencing_calibration.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working local Docker daemon"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "hatchling>=1.32.0",
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
