[project]
name = "tetrabench"
version = "0.3.0"
description = "Harbor evaluation orchestration with durable artifact publication"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shresht Bhowmick" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3==1.43.83",
    "botocore[crt]==1.43.83",
    "harbor[modal]==0.22.0",
    "json-with-comments==1.3.0",
    "modal==1.5.4",
    "platformdirs>=4.11.5",
    "pydantic==2.13.5",
    "rfc8785==0.1.4",
    "rich>=15.0.0",
    "tomlkit>=0.13.3",
    "typer>=0.27.2",
]

[project.scripts]
tetrabench = "tetrabench.cli:main"

[project.urls]
Homepage = "https://github.com/Tetraslam/tetrabench"
Repository = "https://github.com/Tetraslam/tetrabench"
Issues = "https://github.com/Tetraslam/tetrabench/issues"
Documentation = "https://github.com/Tetraslam/tetrabench#readme"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetrabench"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "tetrabench/_distribution/pyproject.toml"
"uv.lock" = "tetrabench/_distribution/uv.lock"

[tool.hatch.build]
exclude = [
    "/questionnaire-meme.png",
    "/tests/test_authority_fencing_task.py",
    "/tests/test_authority_fencing_detached_admission.py",
    "/tools/run_authority_fencing_admission.py",
    "/tools/run_authority_fencing_detached_admission.py",
    "/tests/test_authority_fencing_calibration.py",
    "/tools/run_authority_fencing_calibration.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a working local Docker daemon",
    "native: requires the locked official native consumer installation",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "hatchling>=1.32.0",
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "twine==7.0.0",
    "ty>=0.0.75",
]
