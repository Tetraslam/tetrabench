services:
  main:
    environment:
      FORGE_RUN_CAPABILITY: tetrabench-fixture-capability-7e9f9eeb2d74f043
    depends_on:
      forge:
        condition: service_healthy
  forge:
    environment:
      FORGE_RUN_CAPABILITY: tetrabench-fixture-capability-7e9f9eeb2d74f043
    build:
      context: .
      dockerfile: Forge.Dockerfile
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 1s
